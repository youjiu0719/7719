const CLBANK=[{"unit": 1, "title": "The Happy Prince", "passage": "One evening, a small swallow flew into the city. He was tired from his long journey south and decided to rest on the statue. As he settled between the prince’s feet, one drop of water suddenly fell onto him, and then another. The swallow looked up in surprise and saw that the statue was crying. “Who are you, and why are you crying?” asked the swallow. “I am the Happy Prince,” the statue replied.\n\nThe prince explained that when he was alive, he lived in a beautiful palace and never knew sadness. He enjoyed music, dancing, and joy every day. Now, from his high place above the city, he could see hunger, sickness, and suffering everywhere. Though his heart was made of lead, the troubles of the poor filled him with pain.\n\nThe prince wanted the swallow to help a poor seamstress whose son was ill. He asked the bird to take the ruby from his sword and deliver it to her. The swallow agreed and brought the ruby to the woman.\n\nNext, the prince asked him to give one sapphire eye to a poor writer and the other to a girl who sold matches. Now blind, the prince told the swallow to strip away his gold and give it to the poor. By winter, all the gold was gone, and the cold became too much for the swallow, who died at the prince’s feet. At that moment, the prince’s lead heart cracked in two from sadness.", "hits": [{"word": "statue", "answer": "statue", "meaning": "雕像、雕塑", "pos": "n", "start": 117, "end": 123}, {"word": "palace", "answer": "palace", "meaning": "宮殿、皇宮", "pos": "n", "start": 469, "end": 475}, {"word": "hunger", "answer": "hunger", "meaning": "飢餓", "pos": "n", "start": 600, "end": 606}, {"word": "suffering", "answer": "suffering", "meaning": "受苦、苦難", "pos": "n", "start": 622, "end": 631}, {"word": "sword", "answer": "sword", "meaning": "劍、刀", "pos": "n", "start": 846, "end": 851}, {"word": "strip", "answer": "strip", "meaning": "剝奪、移除", "pos": "v", "start": 1083, "end": 1088}]}, {"unit": 1, "title": "The Happy Prince", "passage": "Next, the prince asked him to give one sapphire eye to a poor writer and the other to a girl who sold matches. Now blind, the prince told the swallow to strip away his gold and give it to the poor. By winter, all the gold was gone, and the cold became too much for the swallow, who died at the prince’s feet. At that moment, the prince’s lead heart cracked in two from sadness.\n\nWithout its gold and jewels, the statue was removed to make room for a new one. The prince’s broken lead heart was thrown away beside the dead swallow. Far above the city, God asked an angel to bring him the two most precious things there. The angel returned with the swallow and the prince’s heart, and God said that they would live forever in heaven.", "hits": [{"word": "strip", "answer": "strip", "meaning": "剝奪、移除", "pos": "v", "start": 153, "end": 158}, {"word": "jewel", "answer": "jewels", "meaning": "寶石、珠寶", "pos": "n", "start": 400, "end": 406}, {"word": "statue", "answer": "statue", "meaning": "雕像、雕塑", "pos": "n", "start": 412, "end": 418}, {"word": "angel", "answer": "angel", "meaning": "天使", "pos": "n", "start": 564, "end": 569}, {"word": "precious", "answer": "precious", "meaning": "珍貴的", "pos": "adj", "start": 596, "end": 604}, {"word": "forever", "answer": "forever", "meaning": "永遠", "pos": "adv", "start": 713, "end": 720}]}, {"unit": 2, "title": "From Military Uniforms to Everyday Style", "passage": "Similarly, aviator sunglasses were originally made to help pilots. In the 1930s, pilots struggled with the bright sun. The American company Bausch & Lomb developed these special glasses to cover the whole eye area and protect against strong light. They called this design Ray-Ban, which is now perhaps the most famous sunglasses brand in the world.\n\nIt might sound surprising, but the modern T-shirt also has its origins in the military. From 1913, the US Navy started giving sailors short-sleeved white shirts to wear under their heavy uniforms. Working inside ships was very hot, so sailors often took off their uniform jackets and just wore the T-shirts. Later, actors such as Marlon Brando wore them in films, and this made them very fashionable.", "hits": [{"word": "originally", "answer": "originally", "meaning": "最初、原本", "pos": "adv", "start": 35, "end": 45}, {"word": "pilot", "answer": "pilots", "meaning": "飛行員", "pos": "n", "start": 59, "end": 65}, {"word": "protect", "answer": "protect", "meaning": "保護、防護", "pos": "v", "start": 218, "end": 225}, {"word": "military", "answer": "military", "meaning": "軍隊、軍方", "pos": "n", "start": 428, "end": 436}, {"word": "navy", "answer": "Navy", "meaning": "海軍", "pos": "n", "start": 456, "end": 460}, {"word": "sleeve", "answer": "sleeved", "meaning": "袖子（此處為有袖的）", "pos": "adj", "start": 490, "end": 497}]}, {"unit": 2, "title": "From Military Uniforms to Everyday Style", "passage": "It might sound surprising, but the modern T-shirt also has its origins in the military. From 1913, the US Navy started giving sailors short-sleeved white shirts to wear under their heavy uniforms. Working inside ships was very hot, so sailors often took off their uniform jackets and just wore the T-shirts. Later, actors such as Marlon Brando wore them in films, and this made them very fashionable.\n\nCargo pants are another well-known example. The British and US armies were among the first to use them. Soldiers needed the extra pockets to carry various items while keeping their hands free. In the 1990s, skateboarders and young people started wearing them because they were loose and comfortable.\n\nAs you can see, military history has had a significant influence on modern fashion. Some of the world’s most recognizable everyday styles started out as functional military gear. The next time you wear one of these pieces, remember that even items that were created for practical purposes may become fashion one day.", "hits": [{"word": "military", "answer": "military", "meaning": "軍隊、軍方", "pos": "n", "start": 78, "end": 86}, {"word": "navy", "answer": "Navy", "meaning": "海軍", "pos": "n", "start": 106, "end": 110}, {"word": "sleeve", "answer": "sleeved", "meaning": "袖子（此處為有袖的）", "pos": "adj", "start": 140, "end": 147}, {"word": "extra", "answer": "extra", "meaning": "額外的", "pos": "adj", "start": 526, "end": 531}, {"word": "loose", "answer": "loose", "meaning": "寬鬆的", "pos": "adj", "start": 679, "end": 684}, {"word": "significant", "answer": "significant", "meaning": "重要的、顯著的", "pos": "adj", "start": 746, "end": 757}]}, {"unit": 3, "title": "When AI Always Takes Your Side", "passage": "The study tested 11 popular AI systems, including ChatGPT, Claude, and Gemini, and found that these models agreed with users far more often than humans would. People were also more likely to prefer AI systems that supported their point of view. This may make them more confident that they are right and less willing to apologize when they make mistakes. Lead researcher Myra Cheng worries that over time, this could cause people—especially teenagers and young people—to lose important social skills.\n\nAfter all, in real life, the ability to handle uncomfortable situations comes from real experience. Personal growth sometimes requires hearing difficult truths, and AI systems seem designed not to deliver them. Experts suggest that while AI can be a useful tool, it should not replace the honest feedback that friends, family, or counselors can provide.", "hits": [{"word": "confident", "answer": "confident", "meaning": "有信心的", "pos": "adj", "start": 269, "end": 278}, {"word": "apologize", "answer": "apologize", "meaning": "道歉、認錯", "pos": "v", "start": 319, "end": 328}, {"word": "researcher", "answer": "researcher", "meaning": "研究人員", "pos": "", "start": 359, "end": 369}, {"word": "situation", "answer": "situations", "meaning": "情況、處境", "pos": "n", "start": 562, "end": 572}, {"word": "replace", "answer": "replace", "meaning": "取代、代替", "pos": "v", "start": 778, "end": 785}, {"word": "feedback", "answer": "feedback", "meaning": "回饋意見", "pos": "", "start": 797, "end": 805}, {"word": "counselor", "answer": "counselors", "meaning": "輔導員", "pos": "", "start": 831, "end": 841}]}, {"unit": 4, "title": "Dealing with Food Delivery", "passage": "1. Ordering for Free Delivery\nHarvey and Grace are ordering food on an app.\nHarvey: I’m ordering lunch right now. Do you want to add anything?\nGrace: Sure. What do you have in your cart so far?\nHarvey: A chicken rice bowl, soup, and an iced tea. The total is $20.\nGrace: How much do we need for free delivery?\nHarvey: The minimum is $30, so we need $10 more.\nGrace: OK, then I think I’d like this fish curry. It sounds good.\nHarvey: Great. Now we’re only $2 short.\nGrace: Then I’ll add a soda for $2.50.\nHarvey: Perfect! We made it. Now we don’t have to pay the delivery fee. I’ll place the order now.\n\n2. Changing the Drop-Off Location\nGrace calls the driver about a problem.\nGrace: Hi, this is the customer for order #4821.\nDriver: Hello. How can I help you? Is everything all right?\nGrace: I just realized I entered the wrong delivery address by mistake. Is it possible to change it?\nDriver: What’s the correct address? I’ll update the location.\nGrace: It’s 105 Park Street, Building B. I accidentally wrote 150 Park Street, Building B.\nDriver: Thanks for letting me know. I’m actually not far away now.\nGrace: That’s such a relief. Thank you for your help. I’m so sorry for the confusion.\nDriver: No worries. I’ll be there in about five minutes.\n\n3. Giving Directions to a Delivery Driver\nAnna gives the delivery driver directions.\nDriver: Hello, this is your delivery driver. I’m nearby, but I can’t find your building.\nAnna: No problem. This happens all the time. Where are you now?\nDriver: I’m next to a convenience store on Lakeview Road.\nAnna: Do you see the library across the street? Go past the library and turn right at the next corner.\nDriver: OK, give me a moment.\nAnna: Once you get there, you’ll see an alley. My building is at the very end on the left. Number 36.\nDriver: I’ll be there in one minute. Thank you for the directions and your patience!", "hits": [{"word": "cart", "answer": "cart", "meaning": "購物車", "pos": "n", "start": 181, "end": 185}, {"word": "customer", "answer": "customer", "meaning": "顧客", "pos": "n", "start": 700, "end": 708}, {"word": "realize", "answer": "realized", "meaning": "發現、意識到", "pos": "v", "start": 800, "end": 808}, {"word": "relief", "answer": "relief", "meaning": "解脫、寬慰", "pos": "n", "start": 1128, "end": 1134}, {"word": "alley", "answer": "alley", "meaning": "小巷", "pos": "n", "start": 1720, "end": 1725}, {"word": "patience", "answer": "patience", "meaning": "耐心", "pos": "n", "start": 1857, "end": 1865}]}, {"unit": 4, "title": "Dealing with Food Delivery", "passage": "2. Changing the Drop-Off Location\nGrace calls the driver about a problem.\nGrace: Hi, this is the customer for order #4821.\nDriver: Hello. How can I help you? Is everything all right?\nGrace: I just realized I entered the wrong delivery address by mistake. Is it possible to change it?\nDriver: What’s the correct address? I’ll update the location.\nGrace: It’s 105 Park Street, Building B. I accidentally wrote 150 Park Street, Building B.\nDriver: Thanks for letting me know. I’m actually not far away now.\nGrace: That’s such a relief. Thank you for your help. I’m so sorry for the confusion.\nDriver: No worries. I’ll be there in about five minutes.\n\n3. Giving Directions to a Delivery Driver\nAnna gives the delivery driver directions.\nDriver: Hello, this is your delivery driver. I’m nearby, but I can’t find your building.\nAnna: No problem. This happens all the time. Where are you now?\nDriver: I’m next to a convenience store on Lakeview Road.\nAnna: Do you see the library across the street? Go past the library and turn right at the next corner.\nDriver: OK, give me a moment.\nAnna: Once you get there, you’ll see an alley. My building is at the very end on the left. Number 36.\nDriver: I’ll be there in one minute. Thank you for the directions and your patience!\n\n4. Reporting a Missing Item\nAnna reports some missing food to the restaurant.\nAnna: Hello, I just received my delivery order. It was #6652.\nStaff: Hi! Is everything OK?\nAnna: Actually, one item is missing. Was it not included?\nStaff: Which item is missing?\nAnna: The pepperoni pizza was left out. We got the vegetarian pizza, fries, and two drinks.\nStaff: Let me check the order details . . . You’re right. We apologize for the mistake. We can send the missing item right away or issue a refund.\nAnna: I’d like the pizza delivered, please.\nStaff: Of course. We’ll send it out immediately.", "hits": [{"word": "customer", "answer": "customer", "meaning": "顧客", "pos": "n", "start": 97, "end": 105}, {"word": "realize", "answer": "realized", "meaning": "發現、意識到", "pos": "v", "start": 197, "end": 205}, {"word": "relief", "answer": "relief", "meaning": "解脫、寬慰", "pos": "n", "start": 525, "end": 531}, {"word": "alley", "answer": "alley", "meaning": "小巷", "pos": "n", "start": 1117, "end": 1122}, {"word": "patience", "answer": "patience", "meaning": "耐心", "pos": "n", "start": 1254, "end": 1262}, {"word": "include", "answer": "included", "meaning": "包含", "pos": "v", "start": 1482, "end": 1490}, {"word": "immediately", "answer": "immediately", "meaning": "立刻", "pos": "adv", "start": 1841, "end": 1852}]}, {"unit": 5, "title": "The Science and Culture of Coriander", "passage": "Coriander has one of the world’s most hotly debated flavors. Many people love the herb’s fresh taste and enjoy it in cuisines from many cultures. However, many others hate it and claim it tastes like soap. Yet this dispute is about more than personal preference—the reason for it, in fact, lies in our DNA.\n\nSome people have a specific gene that makes them especially sensitive to chemicals that are called aldehydes. Because coriander contains these chemicals, which are also found in soap, some people’s brains process the herb as unpleasant. Interestingly, this reaction is far less common among people who grew up eating coriander regularly.\n\nEven the plant’s name comes with some curious facts. In American English, the leaves are called cilantro, while the seeds are called coriander. In places such as the UK and Australia, both parts are simply called coriander. The word “coriander” comes from a Greek word for “stink bug” because the ancient Greeks thought fresh coriander smelled like one. Clearly, the debate over this herb is nothing new!\n\nCoriander’s story also stretches back thousands of years. The oldest known coriander seeds were found in caves in the Levant and date back to roughly 6000 BCE. The Romans used them to flavor bread and preserve meat, and by the Middle Ages, the plants had spread across Europe. From there, explorers carried the herb to new lands until it found a home in Central American and Asian cuisines.", "hits": [{"word": "debate", "answer": "debated", "meaning": "辯論（此處為受到辯論的）", "pos": "adj", "start": 44, "end": 51}, {"word": "flavor", "answer": "flavors", "meaning": "味道、風味", "pos": "n", "start": 52, "end": 59}, {"word": "specific", "answer": "specific", "meaning": "特定的、明確的", "pos": "adj", "start": 327, "end": 335}, {"word": "process", "answer": "process", "meaning": "處理、解讀", "pos": "v", "start": 513, "end": 520}, {"word": "reaction", "answer": "reaction", "meaning": "反應、回應", "pos": "n", "start": 565, "end": 573}, {"word": "stretch", "answer": "stretches", "meaning": "延續、追溯", "pos": "v", "start": 1076, "end": 1085}, {"word": "spread", "answer": "spread", "meaning": "傳播、擴散", "pos": "v", "start": 1308, "end": 1314}]}, {"unit": 5, "title": "The Science and Culture of Coriander", "passage": "Some people have a specific gene that makes them especially sensitive to chemicals that are called aldehydes. Because coriander contains these chemicals, which are also found in soap, some people’s brains process the herb as unpleasant. Interestingly, this reaction is far less common among people who grew up eating coriander regularly.\n\nEven the plant’s name comes with some curious facts. In American English, the leaves are called cilantro, while the seeds are called coriander. In places such as the UK and Australia, both parts are simply called coriander. The word “coriander” comes from a Greek word for “stink bug” because the ancient Greeks thought fresh coriander smelled like one. Clearly, the debate over this herb is nothing new!\n\nCoriander’s story also stretches back thousands of years. The oldest known coriander seeds were found in caves in the Levant and date back to roughly 6000 BCE. The Romans used them to flavor bread and preserve meat, and by the Middle Ages, the plants had spread across Europe. From there, explorers carried the herb to new lands until it found a home in Central American and Asian cuisines.\n\nToday, food companies are creating unusual coriander products, and Taiwan is leading the way. You can find coriander milk tea, coriander-flavored potato chips, and even coriander ice cream. In Japan, Pizza Hut released a coriander pizza that became such a hit with younger customers that the chain brought it back with twice the amount of the herb.", "hits": [{"word": "specific", "answer": "specific", "meaning": "特定的、明確的", "pos": "adj", "start": 19, "end": 27}, {"word": "process", "answer": "process", "meaning": "處理、解讀", "pos": "v", "start": 205, "end": 212}, {"word": "reaction", "answer": "reaction", "meaning": "反應、回應", "pos": "n", "start": 257, "end": 265}, {"word": "stretch", "answer": "stretches", "meaning": "延續、追溯", "pos": "v", "start": 768, "end": 777}, {"word": "spread", "answer": "spread", "meaning": "傳播、擴散", "pos": "v", "start": 1000, "end": 1006}, {"word": "product", "answer": "products", "meaning": "產品", "pos": "n", "start": 1190, "end": 1198}, {"word": "release", "answer": "released", "meaning": "推出、發行", "pos": "v", "start": 1347, "end": 1355}, {"word": "chain", "answer": "chain", "meaning": "連鎖企業", "pos": "n", "start": 1429, "end": 1434}]}, {"unit": 7, "title": "Ariana Grande: A Grand(e) Rebirth", "passage": "After releasing her new album petal earlier this year in the middle of a major world tour, Ariana Grande seems truly unstoppable. However, not so long ago, the award-winning singer actually considered quitting music for good. What made her change her mind? A self-confident witch who is named Glinda!\n\nLong before she took to screens across the world as Glinda, Grande showed clear talent from a young age. Grande released her first album, Yours Truly (2013), at the age of just 20. The album was a commercial hit. But the single “Problem” from her second album really caused her popularity to grow fast.\n\nHowever, as her career was going from strength to strength, tragedy struck not once but three times. In 2017, while Grande was playing a concert in Manchester, UK, someone set a bomb off in the stadium. Twenty-two people lost their lives, and hundreds more were hurt. Soon after, her close friend passed away, and her engagement came to a sudden end. Grande was left deeply shaken by it all.\n\nThough Grande appeared to bounce back from these events by releasing several albums in the following years, the pressure was clearly building. She recently admitted that in 2022, while filming the musical movie Wicked, she seriously thought about giving up on music.", "hits": [{"word": "award", "answer": "award", "meaning": "獎項", "pos": "n", "start": 160, "end": 165}, {"word": "quit", "answer": "quitting", "meaning": "放棄、退出", "pos": "v", "start": 201, "end": 209}, {"word": "bomb", "answer": "bomb", "meaning": "炸彈", "pos": "n", "start": 784, "end": 788}, {"word": "stadium", "answer": "stadium", "meaning": "體育場", "pos": "n", "start": 800, "end": 807}, {"word": "engagement", "answer": "engagement", "meaning": "婚約、訂婚", "pos": "n", "start": 924, "end": 934}, {"word": "admit", "answer": "admitted", "meaning": "承認、坦言", "pos": "v", "start": 1155, "end": 1163}]}, {"unit": 7, "title": "Ariana Grande: A Grand(e) Rebirth", "passage": "However, as her career was going from strength to strength, tragedy struck not once but three times. In 2017, while Grande was playing a concert in Manchester, UK, someone set a bomb off in the stadium. Twenty-two people lost their lives, and hundreds more were hurt. Soon after, her close friend passed away, and her engagement came to a sudden end. Grande was left deeply shaken by it all.\n\nThough Grande appeared to bounce back from these events by releasing several albums in the following years, the pressure was clearly building. She recently admitted that in 2022, while filming the musical movie Wicked, she seriously thought about giving up on music.\n\nIronically, her movie role may have ended up saving her music career. The character of the good witch Glinda, whom Grande plays in the movie, was so confident that it began to rub off on Grande herself. She decided to continue her music career, but on her own terms. She would leave behind the days of long tours and tiring press events. From now on, the creative process would be her focus.", "hits": [{"word": "bomb", "answer": "bomb", "meaning": "炸彈", "pos": "n", "start": 178, "end": 182}, {"word": "stadium", "answer": "stadium", "meaning": "體育場", "pos": "n", "start": 194, "end": 201}, {"word": "engagement", "answer": "engagement", "meaning": "婚約、訂婚", "pos": "n", "start": 318, "end": 328}, {"word": "admit", "answer": "admitted", "meaning": "承認、坦言", "pos": "v", "start": 549, "end": 557}, {"word": "creative", "answer": "creative", "meaning": "有創意的", "pos": "adj", "start": 1016, "end": 1024}, {"word": "focus", "answer": "focus", "meaning": "重點、焦點", "pos": "n", "start": 1046, "end": 1051}]}, {"unit": 8, "title": "Japan’s Robot Wolf Takes On Bears", "passage": "Over the past year, bears have killed 13 people and hurt over 200 others across Japan. To help keep bears away from towns and farms, one Japanese company has developed a clever solution: a robot wolf. Called “Monster Wolf,” it is designed to look like a frightening wild animal and scare away unwanted visitors.\n\nThe Hokkaido-based company Ohta Seiki first introduced the Monster Wolf in 2016. The robot has flashing red LED eyes and can produce over 50 kinds of sounds, including human voices. Some of these sounds can be heard as far as a kilometer away. Ten years after its introduction, demand is higher than ever. In early 2026 alone, the company received more orders than in a typical full year.\n\nAs food becomes harder to find due to climate change, bears are coming into towns more frequently. To keep local people safe, farmers, golf course operators, and rural workers are trying out these wolf-like robots. The Monster Wolf is a powerful example of how technology can solve real-world problems in unexpected ways.", "hits": [{"word": "monster", "answer": "Monster", "meaning": "怪物、怪獸", "pos": "n", "start": 209, "end": 216}, {"word": "frightening", "answer": "frightening", "meaning": "令人害怕的", "pos": "adj", "start": 254, "end": 265}, {"word": "flash", "answer": "flashing", "meaning": "閃爍（此處為閃爍的）", "pos": "adj", "start": 408, "end": 416}, {"word": "kilometer", "answer": "kilometer", "meaning": "公里", "pos": "n", "start": 541, "end": 550}, {"word": "demand", "answer": "demand", "meaning": "需求", "pos": "", "start": 591, "end": 597}, {"word": "rural", "answer": "rural", "meaning": "鄉村的", "pos": "", "start": 865, "end": 870}]}, {"unit": 9, "title": "A Taste of Hawaii: Exploring Oahu", "passage": "Nature is a big part of Oahu’s appeal. Diamond Head, an old volcanic crater on the edge of Waikiki, is the island’s most famous hike. The trail passes through a tunnel and climbs to a century-old lookout with sweeping views of the coast. Farther north, the North Shore is known for giant winter waves, but calmer waters in other areas are perfect for snorkeling or a boat tour.\n\nBeyond its beaches and scenery, Oahu also has an interesting history. In the heart of Honolulu, ‘Iolani Palace is the only royal palace in the US. King Kalākaua loved new technology so much that he lit the building with electricity in 1887—years before the White House. Inside, the grand koa stairs and historic throne room offer a look into Hawaii’s royal past.\n\nOahu’s food tells the story of the people who have called it home. Native Hawaiian dishes include poke, fresh raw fish, and kalua pork, which is slow-cooked in an underground oven until smoky and tender. There are also many dishes that were brought by immigrants. Shave ice, for example, is a fluffy treat with sweet fruit syrups that was introduced from Japan. At a traditional luau, visitors can sample many of these foods while enjoying live music and hula dancing.", "hits": [{"word": "appeal", "answer": "appeal", "meaning": "吸引力、魅力", "pos": "n", "start": 31, "end": 37}, {"word": "tunnel", "answer": "tunnel", "meaning": "隧道、地道", "pos": "n", "start": 161, "end": 167}, {"word": "farther", "answer": "Farther", "meaning": "更遠地", "pos": "adv", "start": 238, "end": 245}, {"word": "electricity", "answer": "electricity", "meaning": "電力", "pos": "n", "start": 599, "end": 610}, {"word": "native", "answer": "Native", "meaning": "原住民的、本地的", "pos": "adj", "start": 810, "end": 816}, {"word": "raw", "answer": "raw", "meaning": "生的、未煮熟的", "pos": "adj", "start": 853, "end": 856}, {"word": "oven", "answer": "oven", "meaning": "烤箱、烤爐", "pos": "n", "start": 918, "end": 922}]}, {"unit": 9, "title": "A Taste of Hawaii: Exploring Oahu", "passage": "Beyond its beaches and scenery, Oahu also has an interesting history. In the heart of Honolulu, ‘Iolani Palace is the only royal palace in the US. King Kalākaua loved new technology so much that he lit the building with electricity in 1887—years before the White House. Inside, the grand koa stairs and historic throne room offer a look into Hawaii’s royal past.\n\nOahu’s food tells the story of the people who have called it home. Native Hawaiian dishes include poke, fresh raw fish, and kalua pork, which is slow-cooked in an underground oven until smoky and tender. There are also many dishes that were brought by immigrants. Shave ice, for example, is a fluffy treat with sweet fruit syrups that was introduced from Japan. At a traditional luau, visitors can sample many of these foods while enjoying live music and hula dancing.\n\nThe end of October brings a different kind of excitement. Kalākaua Avenue in Waikiki fills with people in creative costumes, which turns the famous street into a lively Halloween celebration. For those who want a real scare, the Haunted Plantation in Waipahu is worth a visit. As you walk through the dark village, actors hide in the shadows, ready to jump out at any moment!", "hits": [{"word": "electricity", "answer": "electricity", "meaning": "電力", "pos": "n", "start": 220, "end": 231}, {"word": "native", "answer": "Native", "meaning": "原住民的、本地的", "pos": "adj", "start": 431, "end": 437}, {"word": "raw", "answer": "raw", "meaning": "生的、未煮熟的", "pos": "adj", "start": 474, "end": 477}, {"word": "oven", "answer": "oven", "meaning": "烤箱、烤爐", "pos": "n", "start": 539, "end": 543}, {"word": "avenue", "answer": "Avenue", "meaning": "大街、大道", "pos": "n", "start": 901, "end": 907}, {"word": "shadow", "answer": "shadows", "meaning": "陰影、影子", "pos": "n", "start": 1168, "end": 1175}]}, {"unit": 10, "title": "Trying Tasty Taiwanese Fruits", "passage": "2. Tasting More Fruits\nMiriam continues to introduce the fruits.\nMiriam: Ready for the next one? This is guava.\nGreg: I expected it to be soft, but it’s crunchy! The flavor is mild and a little earthy.\nMiriam: Yes, and it’s rich in vitamin C.\nGreg: Really? I’ll have to eat it more often. And the last one?\nMiriam: This is custard apple. It’s ripe, so just break it open gently.\nGreg: Oh wow—it’s so soft and creamy. It almost melts in your mouth. It tastes like natural ice cream!\nMiriam: Exactly! It’s one of Taiwan’s most beloved fruits. You’re lucky it’s the season for them.\nGreg: Taiwan is definitely a fruit paradise!", "hits": [{"word": "crunchy", "answer": "crunchy", "meaning": "清脆的", "pos": "", "start": 153, "end": 160}, {"word": "vitamin", "answer": "vitamin", "meaning": "維生素", "pos": "n", "start": 232, "end": 239}, {"word": "ripe", "answer": "ripe", "meaning": "成熟的", "pos": "adj", "start": 343, "end": 347}, {"word": "creamy", "answer": "creamy", "meaning": "口感滑順的", "pos": "", "start": 409, "end": 415}, {"word": "beloved", "answer": "beloved", "meaning": "深受喜愛的", "pos": "", "start": 525, "end": 532}, {"word": "definitely", "answer": "definitely", "meaning": "確實", "pos": "", "start": 596, "end": 606}, {"word": "paradise", "answer": "paradise", "meaning": "天堂、樂園", "pos": "n", "start": 615, "end": 623}]}, {"unit": 11, "title": "A Day in Disneyland Paris", "passage": "Disneyland Paris is a magical place with rides, shows, and our favorite characters. When you enter, you’ll walk along Main Street toward the incredible castle at the end. But look out—below it sleeps a fearsome dragon! Do you have the courage to visit it? Other popular attractions include classics like Big Thunder Mountain, Pirates of the Caribbean, and Peter Pan’s Flight. Each area of the park has its own theme, so you can explore many different exciting worlds in one day.", "hits": [{"word": "toward", "answer": "toward", "meaning": "朝、向", "pos": "prep", "start": 130, "end": 136}, {"word": "incredible", "answer": "incredible", "meaning": "令人難以置信的", "pos": "", "start": 141, "end": 151}, {"word": "fearsome", "answer": "fearsome", "meaning": "可怕的", "pos": "", "start": 202, "end": 210}, {"word": "courage", "answer": "courage", "meaning": "勇氣、膽量", "pos": "n", "start": 235, "end": 242}, {"word": "classic", "answer": "classics", "meaning": "經典作品、名著", "pos": "n", "start": 290, "end": 298}, {"word": "theme", "answer": "theme", "meaning": "主題", "pos": "", "start": 410, "end": 415}]}, {"unit": 12, "title": "What Banknotes Tell Us About the Countries That Print Them", "passage": "Many countries use their money to show what makes them special. Some countries, such as Costa Rica, proudly display their nation’s plants and animals. The Costa Rican colón comes in bright, colorful notes with images of coral reefs, butterflies, monkeys, and sloths. Meanwhile, in Switzerland, the nation’s excellence in science and the arts is honored. Today, Swiss franc notes no longer have images of people. Instead, they are vertical and feature pictures of hands working at various activities.\n\nHistory is another common topic. Many notes around the world show important figures who helped shape their countries’ pasts. The UK’s £5 note shows Winston Churchill, with Big Ben visible behind him. The clock face reads three o’clock—the exact time of Churchill’s famous “blood, toil, tears, and sweat” speech.\n\nAside from looking at what notes show, we can learn a lot from why those things are shown. Euro notes’ fictional buildings promote a spirit of unity and fairness among the 21 European countries and 358 million people that use them. In other regions, the ideal of equal rights is favored, as in Australia, one of the few countries in the world to feature a woman on every single note.", "hits": [{"word": "meanwhile", "answer": "Meanwhile", "meaning": "同時", "pos": "adv", "start": 267, "end": 276}, {"word": "excellence", "answer": "excellence", "meaning": "卓越、傑出", "pos": "n", "start": 307, "end": 317}, {"word": "visible", "answer": "visible", "meaning": "看得見的", "pos": "adj", "start": 681, "end": 688}, {"word": "sweat", "answer": "sweat", "meaning": "汗水", "pos": "n", "start": 798, "end": 803}, {"word": "promote", "answer": "promote", "meaning": "促進、提倡", "pos": "v", "start": 937, "end": 944}, {"word": "unity", "answer": "unity", "meaning": "團結", "pos": "n", "start": 957, "end": 962}]}, {"unit": 12, "title": "What Banknotes Tell Us About the Countries That Print Them", "passage": "History is another common topic. Many notes around the world show important figures who helped shape their countries’ pasts. The UK’s £5 note shows Winston Churchill, with Big Ben visible behind him. The clock face reads three o’clock—the exact time of Churchill’s famous “blood, toil, tears, and sweat” speech.\n\nAside from looking at what notes show, we can learn a lot from why those things are shown. Euro notes’ fictional buildings promote a spirit of unity and fairness among the 21 European countries and 358 million people that use them. In other regions, the ideal of equal rights is favored, as in Australia, one of the few countries in the world to feature a woman on every single note.\n\nInterestingly, Australia was also the first country to introduce polymer banknotes. Many modern notes are made of polymer, a type of plastic that’s harder for counterfeiters to copy. They also include security features like holograms, shiny strips, and hidden writing for the same reason. From these developments, we can see the efforts countries take to keep their money safe.", "hits": [{"word": "visible", "answer": "visible", "meaning": "看得見的", "pos": "adj", "start": 180, "end": 187}, {"word": "sweat", "answer": "sweat", "meaning": "汗水", "pos": "n", "start": 297, "end": 302}, {"word": "promote", "answer": "promote", "meaning": "促進、提倡", "pos": "v", "start": 436, "end": 443}, {"word": "unity", "answer": "unity", "meaning": "團結", "pos": "n", "start": 456, "end": 461}, {"word": "plastic", "answer": "plastic", "meaning": "塑膠", "pos": "n", "start": 831, "end": 838}, {"word": "security", "answer": "security", "meaning": "安全、保護措施", "pos": "n", "start": 899, "end": 907}, {"word": "shiny", "answer": "shiny", "meaning": "閃亮的", "pos": "adj", "start": 933, "end": 938}]}, {"unit": 13, "title": "My Favorite Leisure Time Activity", "passage": "My favorite thing to do in my leisure time is swimming. I enjoy it because it is fun, exciting, and good for my health. I started swimming when I was seven years old. At first, I was a little anxious about being in deep water, but after taking swimming lessons, I soon learned how to swim with confidence.\n\nWhen I go swimming, I usually practice different strokes, such as freestyle and backstroke, and I try to improve my skills each time I visit the pool. What I love most about swimming is that it keeps me active and benefits both my physical and mental health. I feel that my body has become stronger since I started, and I always feel happy and relaxed afterward.\n\nTwo years ago, I joined a swimming club and have since made many friends who share the same passion. Right now, we are preparing for a swimming competition later this year, and I can’t wait to see how far we have come. Joining the club reminded me that growth comes from doing the things that once scared you. That is a lesson I carry with me both in and out of the water.", "hits": [{"word": "leisure", "answer": "leisure", "meaning": "閒暇、空閒時間", "pos": "n", "start": 30, "end": 37}, {"word": "anxious", "answer": "anxious", "meaning": "焦慮不安的", "pos": "adj", "start": 192, "end": 199}, {"word": "confidence", "answer": "confidence", "meaning": "信心", "pos": "", "start": 294, "end": 304}, {"word": "physical", "answer": "physical", "meaning": "身體的", "pos": "", "start": 538, "end": 546}, {"word": "afterward", "answer": "afterward", "meaning": "之後、後來", "pos": "adv", "start": 659, "end": 668}, {"word": "passion", "answer": "passion", "meaning": "熱情、強烈興趣", "pos": "n", "start": 763, "end": 770}, {"word": "competition", "answer": "competition", "meaning": "比賽", "pos": "", "start": 815, "end": 826}]}, {"unit": 14, "title": "Microhabits: Small Wins Keep You Moving", "passage": "Have you ever set a goal and felt excited at first, only to give up a few weeks later? Many people think they fail because they lack motivation or self-discipline. However, the real problem is often that their goals are too big and difficult to maintain. This is where microhabits can help.\n\nMicrohabits are tiny actions that take very little time or effort. Instead of saying, “I want to get healthier,” you might decide to walk for five minutes after lunch. Because the task is small and clear, it feels easy to start and hard to skip. Each small success gives your brain a sense of achievement, which encourages you to repeat the action and makes the next step feel even more natural.\n\nTo make a microhabit work, focus on one change at a time and remove anything that gets in your way. Put your running shoes near the door, or keep healthy snacks close. When the first step feels simple, you are far more likely to keep going until the habit becomes part of your daily life.\n\nOnce a microhabit becomes routine, you can make it stronger by linking it to something you already do. That original routine then becomes a trigger, a signal that reminds you to start the new habit. For example, after you brush your teeth, you might stretch for two minutes. The routine kicks things off, so you do not need memory or motivation.", "hits": [{"word": "goal", "answer": "goal", "meaning": "目標、目的", "pos": "n", "start": 20, "end": 24}, {"word": "maintain", "answer": "maintain", "meaning": "維持、保持", "pos": "v", "start": 245, "end": 253}, {"word": "task", "answer": "task", "meaning": "任務、工作", "pos": "n", "start": 472, "end": 476}, {"word": "skip", "answer": "skip", "meaning": "跳過、略過", "pos": "v", "start": 532, "end": 536}, {"word": "achievement", "answer": "achievement", "meaning": "成就、成果", "pos": "n", "start": 585, "end": 596}, {"word": "memory", "answer": "memory", "meaning": "記憶、回憶", "pos": "n", "start": 1303, "end": 1309}]}, {"unit": 14, "title": "Microhabits: Small Wins Keep You Moving", "passage": "Microhabits are tiny actions that take very little time or effort. Instead of saying, “I want to get healthier,” you might decide to walk for five minutes after lunch. Because the task is small and clear, it feels easy to start and hard to skip. Each small success gives your brain a sense of achievement, which encourages you to repeat the action and makes the next step feel even more natural.\n\nTo make a microhabit work, focus on one change at a time and remove anything that gets in your way. Put your running shoes near the door, or keep healthy snacks close. When the first step feels simple, you are far more likely to keep going until the habit becomes part of your daily life.\n\nOnce a microhabit becomes routine, you can make it stronger by linking it to something you already do. That original routine then becomes a trigger, a signal that reminds you to start the new habit. For example, after you brush your teeth, you might stretch for two minutes. The routine kicks things off, so you do not need memory or motivation.\n\nYou can take this further with habit stacking. This means linking several habits in a row. For example, after you make your bed, drink a glass of water. Then take a brief walk. Later, read for a few minutes. Over time, these actions form a chain. Each habit triggers the next and moves you toward a bigger goal.", "hits": [{"word": "task", "answer": "task", "meaning": "任務、工作", "pos": "n", "start": 180, "end": 184}, {"word": "skip", "answer": "skip", "meaning": "跳過、略過", "pos": "v", "start": 240, "end": 244}, {"word": "achievement", "answer": "achievement", "meaning": "成就、成果", "pos": "n", "start": 293, "end": 304}, {"word": "memory", "answer": "memory", "meaning": "記憶、回憶", "pos": "n", "start": 1011, "end": 1017}, {"word": "further", "answer": "further", "meaning": "進一步地", "pos": "adv", "start": 1052, "end": 1059}, {"word": "brief", "answer": "brief", "meaning": "簡短的、短暫的", "pos": "adj", "start": 1199, "end": 1204}, {"word": "goal", "answer": "goal", "meaning": "目標、目的", "pos": "n", "start": 1340, "end": 1344}]}, {"unit": 14, "title": "Microhabits: Small Wins Keep You Moving", "passage": "Once a microhabit becomes routine, you can make it stronger by linking it to something you already do. That original routine then becomes a trigger, a signal that reminds you to start the new habit. For example, after you brush your teeth, you might stretch for two const clids=['clsetup','clquiz','clresult'];let cl=null;
function clshow(id){for(const s of ['setup','quiz','results',...clids])$(s).hidden=s!==id}
for(const u of [...new Set(CLBANK.map(q=>q.unit))]){let o=document.createElement('option');o.value=u;o.textContent=`Unit ${u} · ${CLBANK.find(q=>q.unit===u).title}`;$('clunit').append(o)}
function clpool(){return CLBANK.map((q,i)=>i).filter(i=>$('clunit').value==='all'||CLBANK[i].unit===Number($('clunit').value))}
function clsettings(){clshow('clsetup');$('clcount').textContent=`本範圍共 ${clpool().length} 組，每組 6 題。`}
$('clopen').onclick=clsettings;$('clunit').onchange=clsettings;$('clback').onclick=()=>{clids.forEach(s=>$(s).hidden=true);show('setup');refresh()};$('clexit').onclick=clsettings;$('clagain').onclick=clsettings;
function clmake(id){const q=CLBANK[id];const hits=mix(q.hits).slice(0,6).sort((a,b)=>a.start-b.start);let used=new Set(hits.map(h=>h.answer.toLowerCase())),units=new Set([q.unit]);let words=hits.map(h=>h.answer);for(const r of mix(BANK)){if(units.has(r.unit)||used.has(r.answer.toLowerCase())||q.hits.some(h=>h.word===r.word))continue;units.add(r.unit);used.add(r.answer.toLowerCase());words.push(r.answer);if(words.length===10)break}return {id,hits,words:mix(words),picks:Array(6).fill(null),done:false,active:0}}
function clstart(ids){cl={groups:ids.map(clmake),index:0};clrender()}
$('clstart').onclick=()=>clstart(mix(clpool()));
function clrender(){if(cl.index>=cl.groups.length){clresults();return}clshow('clquiz');let g=cl.groups[cl.index],q=CLBANK[g.id];$('clloc').textContent=`Unit ${q.unit} · 第 ${cl.index+1} / ${cl.groups.length} 組`;$('cltitle').textContent=q.title;$('clscore').textContent=`已填 ${g.picks.filter(Boolean).length}/6`;$('clprogress').value=100*(cl.index+Number(g.done))/cl.groups.length;$('clpass').replaceChildren();let pos=0;g.hits.forEach((h,i)=>{let b=document.createElement('button');b.textContent=`(${i+1}) ${g.picks[i]||'______'}`;b.className=g.done?(g.picks[i]===h.answer?'good':'bad'):(g.active===i?'active':'');b.disabled=g.done;b.onclick=()=>{g.active=i;clrender()};$('clpass').append(document.createTextNode(q.passage.slice(pos,h.start)),b);pos=h.end});$('clpass').append(document.createTextNode(q.passage.slice(pos)));$('clbank').replaceChildren();g.words.forEach((w,i)=>{let b=document.createElement('button');b.textContent=`${'ABCDEFGHIJ'[i]}. ${w}`;b.disabled=g.done||g.picks.some((p,j)=>p===w&&j!==g.active);b.onclick=()=>{g.picks[g.active]=w;let n=g.picks.findIndex(x=>!x);g.active=n<0?g.active:n;clrender()};$('clbank').append(b)});$('clsubmit').disabled=g.picks.some(x=>!x);$('clsubmit').hidden=g.done;$('clnext').hidden=!g.done;$('clnext').textContent=cl.index===cl.groups.length-1?'查看成績 →':'下一組 →';$('clfeedback').replaceChildren();if(g.done){let n=g.hits.filter((h,i)=>h.answer===g.picks[i]).length;let h=document.createElement('h3');h.textContent=`本組答對 ${n}/6`; $('clfeedback').append(h);g.hits.forEach((x,i)=>{let p=document.createElement('div');p.textContent=`${i+1}. ${x.answer} — ${x.meaning}${g.picks[i]===x.answer?' ✓':'（你的答案：'+g.picks[i]+'）'}`;$('clfeedback').append(p)})}}
$('clsubmit').onclick=()=>{let g=cl.groups[cl.index];if(g.picks.every(Boolean)){g.done=true;clrender()}};$('clnext').onclick=()=>{cl.index++;clrender();window.scrollTo(0,0)};
function clresults(){clshow('clresult');let total=cl.groups.length*6,n=0;$('clreview').replaceChildren();for(const g of cl.groups){let wrong=g.hits.map((h,i)=>({h,p:g.picks[i]})).filter(x=>x.h.answer!==x.p);n+=6-wrong.length;if(wrong.length){let a=document.createElement('article');let title=document.createElement('strong');title.textContent=`Unit ${CLBANK[g.id].unit} · ${CLBANK[g.id].title}`;a.append(title);for(const x of wrong){let p=document.createElement('p');p.textContent=`${x.p} → ${x.h.answer}（${x.h.meaning}）`;a.append(p)}$('clreview').append(a)}}$('clfinal').textContent=`${Math.round(n/total*100)} 分`;$('cldetail').textContent=`答對 ${n} / ${total} 個空格`;$('clretry').disabled=n===total}
